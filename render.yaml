services:
  # Backend API & Autonomous Research Engine (Playwright in Docker with pre-baked Linux browser dependencies)
  - type: web
    name: javis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    branch: main
    envVars:
      - key: PORT
        value: "8000"
      - key: BROWSER_HEADLESS
        value: "true"
      - key: BROWSER_CHANNEL
        value: chromium
      - key: FRONTEND_URL
        value: "https://javis-frontend.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false

  # Frontend Next.js Dashboard
  - type: web
    name: javis-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BACKEND_PORT
        value: "8000"
      - key: BACKEND_URL
        value: "https://javis-backend-3pfy.onrender.com"
      - key: NEXT_PUBLIC_BACKEND_URL
        value: "https://javis-backend-3pfy.onrender.com"
